<svg width="40" height="40" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Cassette body -->
  <rect x="10" y="20" width="80" height="60" fill="#2d4a9d" rx="3"/>
  
  <!-- Label area -->
  <rect x="15" y="25" width="70" height="35" fill="#f5f5dc" rx="2"/>
  
  <!-- Reels -->
  <circle cx="30" cy="60" r="12" fill="#4a4a4a"/>
  <circle cx="30" cy="60" r="8" fill="#888"/>
  <circle cx="70" cy="60" r="12" fill="#4a4a4a"/>
  <circle cx="70" cy="60" r="8" fill="#888"/>
  
  <!-- Tape -->
  <rect x="38" y="57" width="24" height="6" fill="#6b4423"/>
  
  <!-- Label lines -->
  <line x1="20" y1="32" x2="80" y2="32" stroke="#000" stroke-width="1"/>
  <line x1="20" y1="38" x2="80" y2="38" stroke="#000" stroke-width="1"/>
  <line x1="20" y1="44" x2="80" y2="44" stroke="#000" stroke-width="1"/>
  
  <!-- Window for reels -->
  <rect x="42" y="62" width="16" height="8" fill="#f5f5dc"/>
</svg>
